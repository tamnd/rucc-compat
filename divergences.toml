# Differences between rucc and the reference compiler that we have decided to live with for
# now. Anything listed here is counted and reported separately. Anything not listed here
# fails the run.
#
# An entry needs id, what, why, issue and rule, and the file does not load without them. The
# rule names the comparison it suppresses and the rules live in the harness, so an entry
# cannot quietly widen itself. The rules are `token-text`, `spacing` and `markers`, and
# `answer` for a kernel probe that rucc and GCC answer differently, where `matches` looks in
# the probe's question as `rk probes` prints it. The rule `object` is for a kernel-asm case whose
# objects differ, where `matches` looks in the case name and the first difference.
#
# An entry may also say where it applies, with `corpus`, `unit` and `matches`, and every one
# it states has to hold. A `token-text` entry has to state at least one of them, because an
# unscoped one would silence the rule that decides whether the output still compiles to the
# same program, in every corpus at once. So do `answer` and `object` entries, for the same reason.
#
# Every entry is a promise to remove the entry. When the issue closes, the entry goes with it
# and the run gets stricter on its own.

[[divergence]]
id = "darwin-availability"
what = "A declaration in an Apple system header comes out without its availability attribute."
why = "Apple's AvailabilityInternal.h defines the whole family behind __has_attribute(availability), which we answer no to because the attribute is not implemented, and answering no is the matrix working as intended: a header that asks gets the fallback path rather than syntax we cannot parse."
issue = "https://github.com/tamnd/rucc/issues/31"
rule = "token-text"
matches = "__attribute__((availability("

[[divergence]]
id = "cet-indirect-return"
what = "`swapcontext` in glibc's `ucontext.h` comes out without its `__indirect_return__` attribute."
why = "glibc's bits/indirect-return.h gates the attribute on `__CET__`, not on `__has_attribute`, which both compilers answer yes to. A distribution builds gcc with `--enable-cet` so it defines `__CET__` as 3; a gcc built from source without that option defines no `__CET__` and declares `swapcontext` exactly the way rucc does, which is why this fails on a runner and passes on a machine with a source build. rucc defines no `__CET__` because the macro is a statement that the object carries the IBT and shadow stack markings, and a binary that says so without emitting `endbr64` faults on a machine that enforces it. That is codegen work."
issue = "https://github.com/tamnd/rucc/issues/163"
rule = "token-text"
unit = "posix"
matches = "__indirect_return__"

[[divergence]]
id = "system-header-macro-expansion"
what = "A line holding an expansion of a macro defined in a system header comes out on one line where the reference breaks it into four."
why = "GCC wraps such an expansion in a pair of line markers, the opening one carrying the `3` flag that says the tokens came from a system header, and the newlines around those markers stay in the output even in a run that is not comparing markers. rucc does not record which header an expansion's tokens came from, so it has nothing to write there. The tokens themselves are the same and in the same order, which is why this is a spacing entry and not a token-text one. It is not scoped to a corpus because any program that uses `NULL`, `stderr` or a signal number meets it: it is the first difference in every one of the 1423 postgres files that differ, and in chibicc before that. A few postgres files also differ later on, where a backslash-newline outside a directive puts tokens on different lines, which is tamnd/rucc#2073 and is also spacing only."
issue = "https://github.com/tamnd/rucc/issues/195"
rule = "spacing"
