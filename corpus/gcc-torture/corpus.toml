outcome = "did not build"
case = "execute/pr80692.c"

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/542"
why = "always_inline is not honoured, so an inline definition marked with it is an undefined reference"
outcome = "did not build"
case = "execute/stdarg-4.c"

# Thirty one programs were here under tamnd/rucc#489, for naming an option the driver did not
# take. That issue is closed. Eleven of them build and run and are gone, and the three below are
# what is left of the block.
#
# Eighteen of the thirty one named an option that turns one of gcc's own passes on or off, which
# is tamnd/rucc#1019, and fifteen of those build and run at all six levels now that such an option
# is taken and dropped. The three left name an option that changes what the program does, so the
# driver refuses it, and it refuses it before anything is read, which is why the check list above
# names the same three.
#
# `execute/pr23135.c` was the fourth of them and is gone too. It moved to the tamnd/rucc#335 block
# once the option was taken, because what stopped it underneath was a structure passed by value
# too large to unroll, and that block is gone now that such a structure is copied by the runtime.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/1051"
why = "-ffast-math defines a macro a header reads and changes the mode the whole process runs in"
outcome = "did not build"
case = "execute/pr39501.c"

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/1052"
why = "-fnon-call-exceptions needs a landing pad for a trapping instruction and there is none"
outcome = "did not build"
case = "execute/20101011-1.c"

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/1053"
why = "-finstrument-functions asks for entry and exit hooks that the program then counts"
outcome = "did not build"
case = "execute/eeprof-1.c"

# Thirteen of the sixteen calls in this program are right and the three behind its own
# `#ifdef __OPTIMIZE__` are not, which is why it passes at -O0 and is listed at the five levels
# an optimizer runs at. The file's comment calls those three extensions to gcc2 whose failure
# indicates an optimization regression, and that is what this is: the builtin is allowed to answer
# zero for anything it does not know. It reached the gate with the `-fgnu89-inline` its own
# dg-options line asks for, and without that option it was never compiling the program it says.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/604"
why = "__builtin_constant_p is answered before inlining, so a constant that only appears after it reads zero"
outcome = "crashed"
opt = ["1", "2", "3", "s", "z"]
case = "execute/bcp-1.c"
