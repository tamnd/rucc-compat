name = "gcc-torture"
summary = "The execution tests of GCC's own torture suite, 1907 programs written over forty years, each one added because it broke a compiler."
source = "tarball"
upstream = "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
version = "16.2.0"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
root = "gcc-16.2.0/gcc/testsuite/gcc.c-torture/execute"
license = "GPL-3.0-or-later"
license-file = "gcc-16.2.0/COPYING3"
extract = [
  "gcc-16.2.0/COPYING3",
  "gcc-16.2.0/COPYING.RUNTIME",
  "gcc-16.2.0/gcc/testsuite/gcc.c-torture/execute",
]

# `spec/14-target-ladder.md` section 14.1 names this suite as part of rung 0, and its exit
# criterion is every torture execution test that does not need an extension we have not written.
# That subset has to be written down somewhere to be checkable, and this file is where.
#
# The tarball is the whole of GCC, a hundred megabytes of it, and the tests are eight. `extract`
# is why that is not a hundred megabytes on every machine that runs the harness. What comes out
# is the execution tests and the two license files, and nothing here is committed: `vendor/` is
# ignored, so no GPL code enters a repository that is Apache 2.0.
#
# The reason this suite is worth the download is that it is not a set of programs somebody wrote
# to be tested. Every file is a bug report that was once a wrong answer from a released compiler,
# reduced and kept, and forty years of them is a map of where compilers go wrong that nobody
# could write from first principles.

# Each of these computes something, compares it against what it should be, and calls `abort` when
# the two disagree, so an exit status of zero is a pass and there is nothing else to consult.
# This is the best of the three oracles: no reference compiler, no recorded output, and the check
# was written by the person who found the bug the program is about.
oracle = "self-check"

[[unit]]
name = "execute"
kind = "source"
dir = "."
# gcc 16 defaults to gnu23, which refuses a hundred of these files on rules C23 tightened, and
# the suite is written in GNU C of no particular year. gnu17 is the last dialect all of it was
# written against, and it is what the differential compares under as well.
flags = ["-std=gnu17"]
skip = [
  # A function with no type in front of it, and nothing on the command line asking for the
  # dialect that allowed it. GCC 14 turned that from a warning into an error, so gcc 16 refuses
  # this file itself under the dialect this unit names. Nothing rucc does or does not do is
  # visible in it, which is what makes it a skip rather than an exclusion. A hundred and four
  # files were here on the same reasoning and are gone, because each of them names the dialect it
  # was written in on its own `dg-additional-options` line and the harness now reads it. Thirty
  # more are gone into the `[[settled]]` block below, which is where a file the reference compiles
  # and rucc will not belongs. Seven entries are left and every one of them is about gcc.
  "930513-1.c",
  # Files that include a source file from `gcc.dg`, which is a sibling directory of this one and
  # not part of what `extract` unpacks. Unpacking the rest of the test suite to run five more
  # files is not a trade worth making, and gcc cannot compile them here either.
  "pr105777.c",
  "pr109938.c",
  "pr109986.c",
  "pr30314.c",
  "pr98304-2.c",
  # A `va_start` written with one argument, which C23 allows and gnu17 does not, so gcc refuses
  # it under the dialect this unit names.
  "pr117432.c",
]

# The `builtins` directory is a suite inside this one, and it is not built the way the rest of it
# is. Every case there defines `main_test` rather than `main`, `main` lives once in `lib/main.c`
# and sets the `inside_main` flag the helpers read, and each case has a file of its own beside it
# holding the library functions that case is about, which abort when they are called from a place
# the optimizer should have folded them away at. A case compiled on its own gets an undefined
# reference to `main`, which is a fact about how it was built rather than about either compiler.
#
# The rule names the directory rather than the fifty nine cases, which is how `builtins.exp` in
# the suite itself decides it, so a case added upstream is covered the day it arrives.
[[alongside]]
unit = "execute"
dir = "builtins"
link = ["builtins/lib/main.c"]
companion = "-lib.c"
# The bodies the helpers include rather than programs. `abs-2-lib.c` is three lines and an
# `#include "lib/abs.c"`, so these twenty eight files go through both compilers as part of the
# cases that include them and none of them is a case.
helpers = ["builtins/lib"]

# A function defined inside another one, which is GNU's nested functions. A call to one goes
# through a trampoline written on the stack, and this compiler will not have them. gcc takes these
# thirty files and rucc reports an error on each, so nothing about the reference is visible here
# and a `skip` would be the wrong shelf: a skip says the reference cannot get through the file
# either, and it can. An exclusion is the wrong shelf as well, because an exclusion names the issue
# that will remove it and no issue will. The decision was argued and finished, and this is where a
# finished decision goes.
#
# Six of the thirty were in the skip array on the wrong reason before this, filed under a missing
# type on the function above them. What was stopping them was never the missing type. It was the
# nested function underneath it, which is what reading the dialect they ask for made visible.
[[settled]]
spec = "spec/13-gnu-compat.md section 13.3"
why = "a call to a nested function needs an executable trampoline on the stack"
cases = [
  "execute/20000822-1.c",
  "execute/20010209-1.c",
  "execute/20010605-1.c",
  "execute/20030501-1.c",
  "execute/20040520-1.c",
  "execute/20061220-1.c",
  "execute/20090219-1.c",
  "execute/920415-1.c",
  "execute/920428-2.c",
  "execute/920501-7.c",
  "execute/920612-2.c",
  "execute/920721-4.c",
  "execute/921017-1.c",
  "execute/921215-1.c",
  "execute/931002-1.c",
  "execute/comp-goto-2.c",
  "execute/nest-align-1.c",
  "execute/nest-stdar-1.c",
  "execute/nestfunc-1.c",
  "execute/nestfunc-2.c",
  "execute/nestfunc-3.c",
  "execute/nestfunc-5.c",
  "execute/nestfunc-6.c",
  "execute/nestfunc-7.c",
  "execute/pr103405.c",
  "execute/pr22061-3.c",
  "execute/pr22061-4.c",
  "execute/pr24135.c",
  "execute/pr51447.c",
  "execute/pr71494.c",
]

# What is left is 11 cases out of 1870, so 1859 of them pass, and none of the 11 is stale. Every
# entry names the issue that will take it off the list, and the list is meant to shrink: `check`
# and `exec` both fail on an entry that no longer excludes anything, so a gap the compiler closes
# is a red run here until somebody deletes the line.
#
# The one thing that was holding back more files than everything else together is gone. A call to
# a `__builtin_` this compiler had never heard of used to stop 510 of them, and the library
# builtins are declared now and the call goes to the library function of the same name, which took
# 422 files off this list at once. What was left of that block is sorted below by what each file is
# actually waiting on, which is what the one big block was hiding.
#
# Ninety eight more programs are offered here than were before, because the skip array above went
# from 135 entries to 7 once the harness started reading the `dg-additional-options` line each of
# them writes, and the thirty nested function files moved to the block that fits them. Ninety seven
# of the ninety eight pass. Sixty seven came off this list at the same time and for the same reason
# read from the other side: they were listed for a gap that was never there, and what was actually
# stopping them was the dialect they had asked for and not been given.
#
# Seven came off in tamnd/rucc#1082, which taught the walk to hold, pass, return, copy, convert,
# add, subtract, negate and compare a `_Complex` value. Six of them are the complex block and one
# was the flag reader again: `20010605-2.c` was listed under complex arithmetic and had nothing
# complex in it. What is left under that issue is waiting on the multiply, the divide, the
# conjugate, imaginary constants or `_Complex` on an integer type, and each of those is a piece of
# the language rather than a file.
#
# Three more came off in tamnd/rucc#1089, which added the imaginary constant. All three start with a
# complex object at file scope given a value like `1.0 + 2.0i`, so what they were waiting on was the
# folding rather than the arithmetic. What is left under the issue now is the multiply, the divide,
# the conjugate, `_Complex` on an integer type and bare `_Complex` meaning `_Complex double`.
#
# Four more came off in tamnd/rucc#1101, which compiles the complex multiply and the complex divide
# as the calls into libgcc that gcc compiles them into. One of the three `cdivchk` files is not
# among them and has moved to the eighty bit float instead: its whole subject is a `long double`
# divide, and what stops it is that the back end has no rule for a value that wide rather than
# anything about complex arithmetic. It still builds, since nothing that wide reaches the back end
# until something is run, so it is named on the execution side alone now.
#
# `pr49218.c` and `pr84748.c` come off with them and belong to none of this. Both were waiting on a
# cast between a 128-bit integer and a floating type, which tamnd/rucc#1099 and tamnd/rucc#1100
# landed, and the staleness rule is what noticed. That was the whole of what tamnd/rucc#351 was
# holding back here, so the entry for it is gone rather than shorter.
#
# One more comes off in tamnd/rucc#1111, which reads `_Complex` written with no type beside it as
# `_Complex double` the way gcc does. `20050121-1.c` writes the same thing and stays, because the
# rest of what it writes is `_Complex` on an integer type, which is the piece of tamnd/rucc#201
# that has not landed. What is left under that issue is the conjugate, the complex integer types
# and the imaginary suffix on an integer constant.
#
# Three more come off in tamnd/rucc#1141, which reads `~` on a complex operand as the conjugate the
# way gcc does and gives the `conj`, `creal` and `cimag` families their answers rather than a call.
# `20020411-1.c` passes at all six levels and is off both lists. The two `builtins/complex-1` files
# compile now and are off the check list, and they were never on the execution one, because what is
# left of them is the `link_error` calls their own harness writes: the comparison that decides each
# one folds at file scope and does not fold inside a function body, where a complex value lives in
# memory and it is the optimizer rather than the walk that would have to see through it. That is a
# piece of work of its own. `complex-6.c` stays for `_Complex int` and `_Complex long int`, and the
# conjugate half of it works at every width including `long double`. What is left under the issue
# is the complex integer types and the imaginary suffix on an integer constant.
#
# Five more come off in tamnd/rucc#1161, which reads `_Complex` on an integer type and the
# imaginary suffix on an integer constant. That is the last of what tamnd/rucc#201 named, so the
# issue is closed and nothing is excluded under it any more. `20041124-1.c`, `20041201-1.c`,
# `pr104604.c`, `pr38151.c` and `pr56837.c` pass at all six levels and are off both lists.
# `20050121-1.c` and `complex-6.c` are off the check list and stay on the execution one, and what
# stops them now has nothing to do with complex integers: both return a `_Complex long double`,
# which the psABI puts in `st(0)` and `st(1)` and which the back end has no rule for, so both are
# named under tamnd/rucc#1162 instead. A plain `long double` return works and it is the pair that
# does not. They come off the check side because `check` stops at the IR and the gap is below it,
# which is the same place the `cdivchk` file above ended up for the same kind of reason.
#
# Six more come off in tamnd/rucc#1139, which lowers `__builtin_prefetch`. They are the whole of the
# `builtin-prefetch` set and they pass at all six levels.
#
# Six more come off in tamnd/rucc#1204, which implements the three builtins that were left in that
# block: `__builtin_trap`, `__builtin_assume_aligned` and `__builtin_classify_type`. That is the
# last of what tamnd/rucc#313 named, so the issue is closed and nothing is excluded under it any
# more. `20020418-1.c`, `20040709-1.c`, `20040709-2.c`, `20040709-3.c`, `pr115033.c` and
# `pr125291.c` build and run correctly at all six levels and are off both lists.
#
# Sixteen move rather than come off in tamnd/rucc#225, which declares the `_chk` builtins and calls
# the checking function in the library for each of them. One comes off: `pr23484-chk.c` compiles now
# and is off the check list, and it was never on the execution one for the reason every file in this
# directory is not, which is tamnd/rucc-compat#110. The other fifteen compile as far as the first
# `__builtin_setjmp` their own harness writes, so what stops them is the same thing that stops the
# `-lib` half of each pair, and they are named under tamnd/rucc#223 with it instead. Nothing is
# excluded under tamnd/rucc#225 any more, and what is left of that issue is folding a checking call
# into the plain library function where the size argument says nothing is known, which is an
# optimization on top of a call that is already correct and which no file here notices.
#
# The whole of the tamnd/rucc#223 block comes off the check list in the first half of that issue,
# which builds `__builtin_setjmp` and `__builtin_longjmp` down to the IR. That is thirty six cases,
# the fifteen `_chk` ones that moved here a moment ago among them, and it is the largest block ever
# to come off this list at once. The four that were on the execution list stay on it under the same
# issue and for a different reason: the pair is two instructions in the IR now and no back end rule
# writes either of them, so what was `E0500` on a name nothing declared is `E0653` on an instruction
# nothing lowers. The other thirty two are in `execute/builtins` and are not on the execution list
# at all, for the reason every file in that directory is not, which is tamnd/rucc-compat#110.

# `execute/builtins/fprintf.c`, `fputs.c` and `printf.c` were in the block below and are not any
# more. They wrote the stdio builtins that take a stream, which the compiler's table had no way to
# name, and the table can say it now. They came off the execution list as well, in tamnd/rucc#1636,
# which is the fold each of them checks for beyond the declaration: a call in the printf family
# that writes a string nothing has to be formatted into becomes the smaller call that writes it.
# All three run correctly at all six levels.
[[exclude]]
cases = [
  "execute/pr47237.c",
  "execute/pr85331.c",
  "execute/pr94591.c",
]
issue = "https://github.com/tamnd/rucc/issues/227"
why = "a builtin that belongs to no family is not declared, E0500"

# `execute/va-arg-pack-1.c` was in a block of its own here under tamnd/rucc#157 and is not any
# more. The reason on it had stopped being the reason: `__builtin_va_arg_pack` gets through the
# front end now, so `check` takes the file all the way through the tast, the IR and the round trip
# and the entry was reporting a diagnostic nobody sees. What is left of the issue is on the
# execution side, where the program still does not link.

[[exclude]]
cases = [
  "execute/20040308-1.c",
  "execute/align-nest.c",
]
issue = "https://github.com/tamnd/rucc/issues/202"
why = "a bit-field after a member of no fixed size is refused, E0519"

[[exclude]]
case = "execute/20020412-1.c"
issue = "https://github.com/tamnd/rucc/issues/202"
why = "a whole object of no fixed size passed by value is refused, E0519"

[[exclude]]
case = "execute/pr70460.c"
issue = "https://github.com/tamnd/rucc/issues/1198"
why = "the difference of two label addresses is refused in a static initializer, E0618"

[[exclude]]
case = "execute/pr80692.c"
issue = "https://github.com/tamnd/rucc/issues/207"
why = "decimal floating constants are not supported"

# Thirty one programs used to be here, under tamnd/rucc#489, for naming an option the driver did
# not take. That issue is closed and thirteen of them came off this list with it. Eighteen were
# left naming an option that turns one of gcc's own passes on or off, which is tamnd/rucc#1019,
# and that is closed as well: a flag asking for a pass this compiler does not have is a hint about
# speed, so fifteen of the eighteen are taken and dropped and pass now.
#
# The three below are what is left of the block, and each of them names an option that changes
# what the program does rather than how fast it does it, which is why each is refused with a
# reason and has an issue of its own. The execution list further down names the same three,
# because an option the driver refuses stops the program before either command looks at it.
[[exclude]]
case = "execute/pr39501.c"
issue = "https://github.com/tamnd/rucc/issues/1051"
why = "-ffast-math defines a macro a header reads and changes the mode the whole process runs in"

[[exclude]]
case = "execute/20101011-1.c"
issue = "https://github.com/tamnd/rucc/issues/1052"
why = "-fnon-call-exceptions needs a landing pad for a trapping instruction and there is none"

[[exclude]]
case = "execute/eeprof-1.c"
issue = "https://github.com/tamnd/rucc/issues/1053"
why = "-finstrument-functions asks for entry and exit hooks that the program then counts"

# Ten of these were here and are not any more. They got all the way through and stopped on the last
# step of `check`, which prints the IR and reads it back, each of them on one instruction built over
# a value that nothing defines. Three were a loop counter nothing reads and seven were the result of
# a short circuit the program throws away, and both reduced to four lines. Nothing was miscompiled,
# because the instruction was dead and the code generator never saw it, which is why all ten were
# passes on the execution list below the whole time they were here. That is tamnd/rucc#1016 and it
# was control flow simplification dropping a block parameter nothing reads and leaving the
# instruction that was reading it, which only shows at `-O0` because `-O0` runs that pass and no
# other.

# The execution list, which is what tamnd/rucc-compat#30 asked for. `exec` builds each of these
# programs three ways and runs it, and the self check inside the program decides whether the run
# was right, so this list is about what the compiler produced rather than about what it accepted.
#
# It is shorter than that issue expected. The guess there was nineteen hundred programs of red.
# The unit is 1783 programs, which is the 1907 in the tarball less the 7 skipped, the 30 settled
# above and the 87 that exist to be included by another file, and at `-O0` 1750 of them pass, 24
# are named below and 9 are refused by gcc 16 as well. At `-O3` it is 1700, 35 and 18, and the
# other 30 are what the levels above `-O0` still get wrong, every one of them under `builtins` and
# every one of them a library call this compiler does not fold yet. The reason for the gap between
# the guess and the count is that the issue was written when a call to an unknown builtin stopped
# five hundred files at once, and it said to wait until the lowering rule set stopped moving so
# fast. It has.
#
# The programs gcc refuses are not on this list and are not in the skip list either. They are
# decided by running the reference, so they cannot go stale and nobody has to notice when gcc
# changes its mind. The count moves with the level, because what gcc will accept is partly a
# question about the level: 9 at `-O0` and 18 at `-O3`. There are far fewer of them than there
# used to be, because a program that names its own options in a `dg-options` or
# `dg-additional-options` line is now compiled with them and nearly all of what gcc was refusing
# it was refusing for want of the dialect the program asked for.
#
# 36 cases are named here across the six levels, and 21 blocks name them, because the reasons
# are far fewer than the programs. The blocks are roughly sorted by size and none of them is large
# any more: the biggest names five cases and two thirds of them name one. Inline assembly used to be
# first by a long way, at seventy three cases, and it is three now that a template with no
# instructions in it lowers, so what is left of it is a template with instructions in it and an
# `asm goto`. Complex arithmetic was twenty one and is gone. The option block was eighteen and is
# three entries of one case each, which are the only entries on this list that are about the
# driver rather than about the rule set. `__int128` was third and is one case now.
#
# Two of the questions that issue left open have answers now. The timeout stays at ten seconds:
# every program that passes finishes far inside it and nothing is on the list for being slow. The
# one program that used to run out of it was `pr15296.c`, which was a loop the compiler had turned
# into one that does not end, and it is a pass now. And all three build paths run, because they
# can disagree: `pr54937.c` used to fail on the driver path and pass on the other two, which was
# the one relocation a position independent link refuses, and the driver path is the one that makes
# such a link. A list written against one path would have called that a pass. It is fixed and it is
# still the reason all three run.
#
# Those numbers are what a machine says, not what a machine said once, and they were wrong here
# for a while in two ways worth writing down. Six sweeps at six levels ran at once and shared a
# scratch directory, which produced wrong answers scattered over programs that pass when the
# sweep is run alone. And thirteen entries were written against a build of the compiler that was
# older than main, so they named a gap that had already been closed. Both were caught by the
# staleness rule rather than by anybody rereading the list, which is the argument for the rule.
# The list is clean on that count as this is written: a sweep at all six levels reports nothing
# stale, so every case named below is a case that still fails at the level it is named for, and
# nothing below is describing a gap the compiler has already closed.

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/326"
why = "an eighty bit float has no type in the rule set, E0653"
outcome = "did not build"
cases = [
  "execute/20080502-1.c",
  "execute/ieee/cdivchkld.c",
  "execute/ieee/copysign1.c",
  "execute/ieee/copysign2.c",
]

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/1162"
why = "returning a `_Complex long double` is the x87 pair and has no rule, E0653"
outcome = "did not build"
cases = [
  "execute/20050121-1.c",
  "execute/complex-6.c",
]

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/309"
why = "an overflow checked arithmetic builtin has no lowering, E0686"
outcome = "did not build"
case = "execute/pr84169.c"

# `execute/20041114-1.c` was in this block and is not any more. It asks for the comparison in
# `var <= 0 || (unsigned long) (unsigned) (var - 1) < UINT_MAX` to fold to one, which the optimizer
# now does, so the call it guards is gone and the definition the program deliberately leaves out no
# longer has to exist.
#
# `execute/20030216-1.c` was in this block and is not any more. It reads a `const double`, converts
# it to `int` and calls the missing function when the answer is not one, which wanted two folds
# rucc did not have: a conversion from a floating point constant to an integer, and a load from an
# object nothing can write to. Both are in now, tamnd/rucc#1357 and tamnd/rucc#1358, so the
# comparison is a constant and the call is gone at all five levels.
#
# `execute/compare-3.c` and `execute/ieee/compare-fp-3.c` were in this block and are not any more.
# Both write two comparisons of the same two values either side of an `&&` or an `||` and ask for
# the pair to come out as one comparison or as a constant, which the optimizer now does by reading
# a predicate as the set of answers it accepts and intersecting or uniting the two sets,
# tamnd/rucc#1416. The calls they guard are gone at all five levels.
#
# `execute/20020720-1.c` was in this block and is not any more. It arrived from the libm block,
# filed on the name of the function it calls rather than on what it does with it, and what it does
# with it is ask for `fabs (x) < 0.0` to fold to false. The optimizer narrows a comparison by the
# buckets the pair can be in now, and a magnitude is never below a constant that is not positive,
# tamnd/rucc#1425, so the call is gone at all five levels.
#
# `execute/shiftopt-1.c` was in this block and is not any more. It asks for two folds. The first is
# a shift by a count of zero, which the optimizer already had, but what that leaves behind is a
# comparison of a value with itself and the optimizer did not decide those, tamnd/rucc#1440. The
# second is a shift of a constant zero in either direction, and of all ones to the right with the
# sign bit coming in, none of which has to know what the count is, tamnd/rucc#1441. Ten calls to
# the missing function before either, six after the first and none after the second, at all five
# levels.
#
# `execute/pure-1.c` was in this block and is not any more. It writes a local array, calls a
# function, reads the array back and branches on what it read, eight times over, and the branch
# guards a call to a function nobody defines. The address of the array is not a thing any of the
# eight calls was given, so no call can have written it, and the optimizer had the answer and no
# way to ask for it: the alias analysis wanted the module a function is in and a function pass is
# handed the function alone, tamnd/rucc#1467. gcc gets four of the eight a second way as well, by
# working out for itself that a static function it can see is `pure` or `const`, which is not
# needed here and is not done. Eight calls to the missing functions before, none after, at all five
# levels.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/361"
why = "the program asks for an optimizer as soon as __OPTIMIZE__ is defined"
outcome = "did not build"
opt = ["1", "2", "3", "s", "z"]
cases = [
  "execute/ieee/fp-cmp-6.c",
  "execute/ieee/fp-cmp-7.c",
  "execute/ieee/fp-cmp-9.c",
]

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/1198"
why = "the difference of two label addresses is refused in a static initializer, E0618"
outcome = "did not build"
case = "execute/pr70460.c"

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/202"
why = "a bit-field after a member of no fixed size is refused, E0519"
outcome = "did not build"
cases = [
  "execute/20040308-1.c",
  "execute/align-nest.c",
]

