# This used to name the three levels an optimizer runs at, because those were the levels that
# inlined `foo` into `main` and put the `_Bool` it returns somewhere the backend had to lower it.
# Now that the file's own `-fgnu89-inline` is read it fails everywhere, since that option makes
# the definition one this file emits rather than one it merely declares, and a function that
# returns a `_Bool` has to be lowered whether or not anything inlined it.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/352"
why = "a one bit integer has no lowering, E0653"
outcome = "did not build"
case = "execute/p18298.c"

# The options each of these asks for and rucc turns down, in the order they are listed:
# `-fnon-call-exceptions`, `-fwrapv` five times, `-finstrument-functions`, the three
# `-fno-tree-*` options on one line, `-ffast-math`, `-fno-ira-share-spill-slots`,
# `-ftree-loop-distribution`, `-fno-strict-overflow`, `-fexpensive-optimizations` with
# `-fno-tree-bit-ccp`, `-ftree-vectorize` with `-fno-vect-cost-model`, `-fno-inline`, and
# `-finput-charset=utf-8`. Three of them, `execute/920612-1.c`, `execute/pr23135.c` and
# `execute/pr40386.c`, name one option that is accepted alongside the one that is not.
#
# `execute/pr23135.c` was on the tamnd/rucc#335 list at five of the six levels before this, for a
# structure passed by value too large to unroll. That gap is still there and is still what stops
# the program once the option is accepted. It is listed here rather than there because the option
# is refused before anything looks at the program, so this is what the run reports today.
#
# None of the rest is a program this could not otherwise build. They arrived the day the harness
# started reading the `dg-options` line, which is the right thing to do and is what turns a
# missing flag from something invisible into something counted. Fourteen distinct options are
# named here and tamnd/rucc#489 is where the flag surface is tracked.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/489"
why = "the program names an option in its own dg-options line that the driver does not accept"
outcome = "did not build"
cases = [
  "execute/20101011-1.c",
  "execute/920612-1.c",
  "execute/920711-1.c",
  "execute/930529-1.c",
  "execute/eeprof-1.c",
  "execute/pr111863-1.c",
  "execute/pr22493-1.c",
  "execute/pr23047.c",
  "execute/pr23135.c",
  "execute/pr39501.c",
  "execute/pr40386.c",
  "execute/pr43236.c",
  "execute/pr57124.c",
  "execute/pr68381.c",
  "execute/pr68532.c",
  "execute/stkalign.c",
  "execute/wchar_t-1.c",
]

# Thirteen of the sixteen calls in this program are right and the three behind its own
# `#ifdef __OPTIMIZE__` are not, which is why it passes at -O0 and is listed at the five levels
# an optimizer runs at. The file's comment calls those three extensions to gcc2 whose failure
# indicates an optimization regression, and that is what this is: the builtin is allowed to answer
# zero for anything it does not know. It reached the gate with the `-fgnu89-inline` its own
# dg-options line asks for, and without that option it was never compiling the program it says.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/604"
why = "__builtin_constant_p is answered before inlining, so a constant that only appears after it reads zero"
outcome = "crashed"
opt = ["1", "2", "3", "s", "z"]
case = "execute/bcp-1.c"

# gcc 16.2.0 aborts on its own build of this program at -O0 and returns zero once the option is
# passed, and rucc and gcc give the same two answers on the two functions it checks, so there is
# no difference between the compilers here at all. The option is written with the other spelling
# of the directive, `dg-additional-options`, which nothing reads yet.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc-compat/issues/80"
why = "the program asks for -fno-trapping-math and the harness does not read the directive it asks with"
outcome = "crashed"
case = "execute/20031003-1.c"
