# The execution list, which is what tamnd/rucc-compat#30 asked for. `exec` builds each of these
# programs three ways and runs it, and the self check inside the program decides whether the run
# was right, so this list is about what the compiler produced rather than about what it accepted.
#
# It is shorter than that issue expected. The guess there was nineteen hundred programs of red.
# The unit is 1772 programs, which is the 1907 in the tarball less the 135 skipped above, and at
# `-O0` 1470 of them pass, 148 are named below and 154 are refused by gcc 16 as well. At `-O3`
# it is 1447, 163 and 162. The reason for the gap between the guess and the count is that the
# issue was written when a call to an unknown builtin stopped five hundred files at once, and it
# said to wait until the lowering rule set stopped moving so fast. It has.
#
# The programs gcc refuses are not on this list and are not in the skip list either. They are
# decided by running the reference, so they cannot go stale and nobody has to notice when gcc
# changes its mind, and there are a few more of them at `-Os` than at `-O0` because some of what
# gcc refuses it only works out once it has folded something. There are fewer of them than there
# used to be, thirteen fewer at `-O0` and three fewer at `-O3`, because a program that names its
# own options in a `dg-options` line is now compiled with them and some of what gcc was refusing
# it was refusing for want of the dialect the program asked for.
#
# 165 cases are named here across the six levels, and 32 blocks name them, because the reasons
# are far fewer than the programs. The blocks are roughly sorted by size, and the largest two are
# complex arithmetic and `__int128`. Inline assembly used to be the first of them by a long way,
# at seventy three cases, and it is three now that a template with no instructions in it lowers:
# what is left of it is a template with instructions in it and an `asm goto`.
#
# Two of the questions that issue left open have answers now. The timeout stays at ten seconds:
# every program that passes finishes far inside it and nothing is on the list for being slow. The
# one program that used to run out of it was `pr15296.c`, which was a loop the compiler had turned
# into one that does not end, and it is a pass now. And all three build paths run, because they
# can disagree: `pr54937.c` used to fail on the driver path and pass on the other two, which was
# the one relocation a position independent link refuses, and the driver path is the one that makes
# such a link. A list written against one path would have called that a pass. It is fixed and it is
# still the reason all three run.
#
# Those numbers are what a machine says, not what a machine said once, and they were wrong here
# for a while in two ways worth writing down. Six sweeps at six levels ran at once and shared a
# scratch directory, which produced wrong answers scattered over programs that pass when the
# sweep is run alone. And thirteen entries were written against a build of the compiler that was
# older than main, so they named a gap that had already been closed. Both were caught by the
# staleness rule rather than by anybody rereading the list, which is the argument for the rule.

