name = "gcc-torture"
summary = "The execution tests of GCC's own torture suite, 1907 programs written over forty years, each one added because it broke a compiler."
source = "tarball"
upstream = "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
version = "16.2.0"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
root = "gcc-16.2.0/gcc/testsuite/gcc.c-torture/execute"
license = "GPL-3.0-or-later"
license-file = "gcc-16.2.0/COPYING3"
extract = [
  "gcc-16.2.0/COPYING3",
  "gcc-16.2.0/COPYING.RUNTIME",
  "gcc-16.2.0/gcc/testsuite/gcc.c-torture/execute",
]

# `spec/14-target-ladder.md` section 14.1 names this suite as part of rung 0, and its exit
# criterion is every torture execution test that does not need an extension we have not written.
# That subset has to be written down somewhere to be checkable, and this file is where.
#
# The tarball is the whole of GCC, a hundred megabytes of it, and the tests are eight. `extract`
# is why that is not a hundred megabytes on every machine that runs the harness. What comes out
# is the execution tests and the two license files, and nothing here is committed: `vendor/` is
# ignored, so no GPL code enters a repository that is Apache 2.0.
#
# The reason this suite is worth the download is that it is not a set of programs somebody wrote
# to be tested. Every file is a bug report that was once a wrong answer from a released compiler,
# reduced and kept, and forty years of them is a map of where compilers go wrong that nobody
# could write from first principles.

# Each of these computes something, compares it against what it should be, and calls `abort` when
# the two disagree, so an exit status of zero is a pass and there is nothing else to consult.
# This is the best of the three oracles: no reference compiler, no recorded output, and the check
# was written by the person who found the bug the program is about.
oracle = "self-check"

[[unit]]
name = "execute"
kind = "source"
dir = "."
# gcc 16 defaults to gnu23, which refuses a hundred of these files on rules C23 tightened, and
# the suite is written in GNU C of no particular year. gnu17 is the last dialect all of it was
# written against, and it is what the differential compares under as well.
flags = ["-std=gnu17"]
skip = [
  # A function with no type in front of it, and nothing on the command line asking for the
  # dialect that allowed it. GCC 14 turned that from a warning into an error, so gcc 16 refuses
  # this file itself under the dialect this unit names. Nothing rucc does or does not do is
  # visible in it, which is what makes it a skip rather than an exclusion. A hundred and four
  # files were here on the same reasoning and are gone, because each of them names the dialect it
  # was written in on its own `dg-additional-options` line and the harness now reads it. Thirty
  # more are gone into the `[[settled]]` block below, which is where a file the reference compiles
  # and rucc will not belongs. Seven entries are left and every one of them is about gcc.
  "930513-1.c",
  # Files that include a source file from `gcc.dg`, which is a sibling directory of this one and
  # not part of what `extract` unpacks. Unpacking the rest of the test suite to run five more
  # files is not a trade worth making, and gcc cannot compile them here either.
  "pr105777.c",
  "pr109938.c",
  "pr109986.c",
  "pr30314.c",
  "pr98304-2.c",
  # A `va_start` written with one argument, which C23 allows and gnu17 does not, so gcc refuses
  # it under the dialect this unit names.
  "pr117432.c",
]

# A function defined inside another one, which is GNU's nested functions. A call to one goes
# through a trampoline written on the stack, and this compiler will not have them. gcc takes these
# thirty files and rucc reports an error on each, so nothing about the reference is visible here
# and a `skip` would be the wrong shelf: a skip says the reference cannot get through the file
# either, and it can. An exclusion is the wrong shelf as well, because an exclusion names the issue
# that will remove it and no issue will. The decision was argued and finished, and this is where a
# finished decision goes.
#
# Six of the thirty were in the skip array on the wrong reason before this, filed under a missing
# type on the function above them. What was stopping them was never the missing type. It was the
# nested function underneath it, which is what reading the dialect they ask for made visible.
[[settled]]
spec = "spec/13-gnu-compat.md section 13.3"
why = "a call to a nested function needs an executable trampoline on the stack"
cases = [
  "execute/20000822-1.c",
  "execute/20010209-1.c",
  "execute/20010605-1.c",
  "execute/20030501-1.c",
  "execute/20040520-1.c",
  "execute/20061220-1.c",
  "execute/20090219-1.c",
  "execute/920415-1.c",
  "execute/920428-2.c",
  "execute/920501-7.c",
  "execute/920612-2.c",
  "execute/920721-4.c",
  "execute/921017-1.c",
  "execute/921215-1.c",
  "execute/931002-1.c",
  "execute/comp-goto-2.c",
  "execute/nest-align-1.c",
  "execute/nest-stdar-1.c",
  "execute/nestfunc-1.c",
  "execute/nestfunc-2.c",
  "execute/nestfunc-3.c",
  "execute/nestfunc-5.c",
  "execute/nestfunc-6.c",
  "execute/nestfunc-7.c",
  "execute/pr103405.c",
  "execute/pr22061-3.c",
  "execute/pr22061-4.c",
  "execute/pr24135.c",
  "execute/pr51447.c",
  "execute/pr71494.c",
]

# What is left is 155 cases out of 1870, so 1715 of them pass. The one thing that was holding
# back more files than everything else together is gone: a call to a `__builtin_` this compiler
# had never heard of used to stop 510 of them, and the library builtins are now declared and the
# call goes to the library function of the same name, which took 422 files off this list at once.
# The 88 that were in that block and are still here are in the blocks below, sorted by what each
# one is actually waiting on now, which is what the old block was hiding. Every entry names the
# issue that will take it off the list, and the list is meant to shrink. Thirty have gone since
# that sorting was done, which is what sorting it was for, and two of the nine blocks are gone
# with them.
#
# Ninety came back at once, which was the last eight blocks. None of them was a new gap: each was
# a call this compiler wrote down to a builtin nothing lowers, which the linker was left to ask
# about, and rucc refuses the call where it is written instead. So those ninety used to reach the
# end of `check` and stop later, and they stop here now, which is the same missing feature read
# off an earlier step. They are sorted by which builtin each one reaches first.
#
# Forty one of the ninety asked for no builtin at all and are gone again. They include a glibc
# header, which defines three static inline functions over the byte swap builtins, and this
# compiler emitted a static function nothing refers to, so a program that never mentioned a byte
# swap ended up carrying three calls to one. That was the block worth the most of the ninety and
# it came out in one piece.
#
# Ninety eight more programs are offered here than were before, because the skip array above went
# from 135 entries to 7 once the harness started reading the `dg-additional-options` line each of
# them writes and the thirty nested function files moved to the block that fits them. Ninety seven of the ninety eight pass. Sixty seven came off this list at the same
# time and for the same reason read from the other side: they were listed for a gap that was never
# there, and what was actually stopping them was the dialect they had asked for and not been
# given. Fifteen went on, which is the price of reading that line. Fourteen of the fifteen name an
# optimizer flag on it that rucc refuses, and they are in the option block below rather than
# quietly compiled without the thing they asked for.

