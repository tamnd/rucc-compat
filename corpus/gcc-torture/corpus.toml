# What is left is 207 cases out of 1772, so 1565 of them pass. The one thing that was holding
# back more files than everything else together is gone: a call to a `__builtin_` this compiler
# had never heard of used to stop 510 of them, and the library builtins are now declared and the
# call goes to the library function of the same name, which took 422 files off this list at once.
# The 88 that were in that block and are still here are in the blocks below, sorted by what each
# one is actually waiting on now, which is what the old block was hiding. Every entry names the
# issue that will take it off the list, and the list is meant to shrink. Thirty have gone since
# that sorting was done, which is what sorting it was for, and two of the nine blocks are gone
# with them.
#
# Ninety came back at once, which was the last eight blocks. None of them was a new gap: each was
# a call this compiler wrote down to a builtin nothing lowers, which the linker was left to ask
# about, and rucc refuses the call where it is written instead. So those ninety used to reach the
# end of `check` and stop later, and they stop here now, which is the same missing feature read
# off an earlier step. They are sorted by which builtin each one reaches first.
#
# Forty one of the ninety asked for no builtin at all and are gone again. They include a glibc
# header, which defines three static inline functions over the byte swap builtins, and this
# compiler emitted a static function nothing refers to, so a program that never mentioned a byte
# swap ended up carrying three calls to one. That was the block worth the most of the ninety and
# it came out in one piece.

