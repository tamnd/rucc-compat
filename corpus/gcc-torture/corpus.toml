name = "gcc-torture"
summary = "The execution tests of GCC's own torture suite, 1907 programs written over forty years, each one added because it broke a compiler."
source = "tarball"
upstream = "https://ftp.gnu.org/gnu/gcc/gcc-16.2.0/gcc-16.2.0.tar.xz"
version = "16.2.0"
sha256 = "e6738e29597f733270731aa90600f37ffdc045079dfc27ec7e8192cc81085c3e"
root = "gcc-16.2.0/gcc/testsuite/gcc.c-torture/execute"
license = "GPL-3.0-or-later"
license-file = "gcc-16.2.0/COPYING3"
extract = [
  "gcc-16.2.0/COPYING3",
  "gcc-16.2.0/COPYING.RUNTIME",
  "gcc-16.2.0/gcc/testsuite/gcc.c-torture/execute",
]

# `spec/14-target-ladder.md` section 14.1 names this suite as part of rung 0, and its exit
# criterion is every torture execution test that does not need an extension we have not written.
# That subset has to be written down somewhere to be checkable, and this file is where.
#
# The tarball is the whole of GCC, a hundred megabytes of it, and the tests are eight. `extract`
# is why that is not a hundred megabytes on every machine that runs the harness. What comes out
# is the execution tests and the two license files, and nothing here is committed: `vendor/` is
# ignored, so no GPL code enters a repository that is Apache 2.0.
#
# The reason this suite is worth the download is that it is not a set of programs somebody wrote
# to be tested. Every file is a bug report that was once a wrong answer from a released compiler,
# reduced and kept, and forty years of them is a map of where compilers go wrong that nobody
# could write from first principles.

# Each of these computes something, compares it against what it should be, and calls `abort` when
# the two disagree, so an exit status of zero is a pass and there is nothing else to consult.
# This is the best of the three oracles: no reference compiler, no recorded output, and the check
# was written by the person who found the bug the program is about.
oracle = "self-check"

[[unit]]
name = "execute"
kind = "source"
dir = "."
# gcc 16 defaults to gnu23, which refuses a hundred of these files on rules C23 tightened, and
# the suite is written in GNU C of no particular year. gnu17 is the last dialect all of it was
# written against, and it is what the differential compares under as well.
flags = ["-std=gnu17"]
