# The options these ask for and rucc turns down: `-fnon-call-exceptions`, `-fwrapv` nine times,
# `-finstrument-functions`, `-ffast-math`, `-fno-ira-share-spill-slots`,
# `-ftree-loop-distribution`, `-fno-strict-overflow`, `-fexpensive-optimizations`,
# `-ftree-vectorize`, `-fno-vect-cost-model`, `-fno-inline`, `-finput-charset=utf-8`,
# `-fno-trapping-math`, `-fno-early-inlining`, `-fno-ipa-cp`, `-fno-tree-coalesce-vars`,
# `-foptimize-strlen`, `-fmodulo-sched` three times, `-fno-dce`, `-fno-strict-aliasing` and six
# more `-fno-tree-*` options. Three of them, `execute/920612-1.c`, `execute/pr23135.c` and
# `execute/pr40386.c`, name one option that is accepted alongside the one that is not.
#
# The issue below is what answers them. Section 4.1's rule is that a flag which is genuinely a
# no-op or a hint about speed is taken and one that would change the output is a hard error naming
# what it would have changed. Most of these are the first kind. `-fwrapv` and
# `-fno-strict-aliasing` are the second, and they are why this is an exclusion rather than a line
# in the argument parser: taking them silently would compile a program that asked for defined
# overflow under rules that do not give it.
#
# `execute/pr23135.c` was on the tamnd/rucc#335 list at five of the six levels before this, for a
# structure passed by value too large to unroll. That gap is still there and is still what stops
# the program once the option is accepted. It is listed here rather than there because the option
# is refused before anything looks at the program, so this is what the run reports today.
# `execute/pr93213.c` moved off the tamnd/rucc#351 list the same way.
#
# None of the rest is a program this could not otherwise build. They arrived the two days the
# harness started reading the `dg-options` line and then the `dg-additional-options` line, which
# is the right thing to do and is what turns a missing flag from something invisible into
# something counted.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/489"
why = "the program names an option in its own dg-options line that the driver does not accept"
outcome = "did not build"
cases = [
  "execute/20031003-1.c",
  "execute/20040409-1w.c",
  "execute/20040409-2w.c",
  "execute/20040409-3w.c",
  "execute/20101011-1.c",
