# The reason here is not the one that was on it either. `bar` is `extern inline` with
# `always_inline` and `gnu_inline` on it, which means the unit has no out of line copy of it and
# every call has to be inlined, and `__builtin_va_arg_pack` is the thing that makes that possible
# by forwarding the variadic arguments of the caller. rucc reads all of it and inlines none of it,
# so the object calls a function nothing defines.
[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/157"
why = "a call to an always_inline gnu_inline function is emitted rather than inlined, so it does not link"
outcome = "did not build"
case = "execute/va-arg-pack-1.c"

[[exec-exclude]]
issue = "https://github.com/tamnd/rucc/issues/207"
