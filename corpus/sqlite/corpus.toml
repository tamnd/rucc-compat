name = "sqlite"
summary = "The SQLite amalgamation, one translation unit of about eight megabytes and the first real program the compiler is aimed at."
source = "tarball"
upstream = "https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz"
version = "3.53.4"
sha256 = "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"
root = "sqlite-autoconf-3530400"

# SQLite is public domain and ships no separate license file. The blessing is at the top of
# every source file it distributes, so the manifest points at the header, which is the file
# a person reading the tree would look at first.
license = "blessing"
license-file = "sqlite-autoconf-3530400/sqlite3.h"

# One file, a quarter of a million lines, and a configuration macro maze on top. It is the
# throughput case and the correctness case at the same time.
[[unit]]
name = "amalgamation"
kind = "source"
files = ["sqlite3.c"]
flags = ["-DSQLITE_THREADSAFE=0", "-DSQLITE_OMIT_LOAD_EXTENSION"]

# The shell is ordinary application code that includes the library and the system headers,
# which is a different mix from the amalgamation.
[[unit]]
name = "shell"
kind = "source"
files = ["shell.c"]
flags = ["-I", "."]

[[unit]]
name = "headers"
kind = "headers"
dir = "."
flags = ["-I", "."]
skip = [
  # A resource script header for the Windows build, and not a C header at all.
  "sqlite3rc.h",
]

# Both source cases are excluded, naming the issue that will take them off this list. An entry
# whose case has started passing fails the run, so the list shrinks as the work lands rather
# than sitting here.
#
# The shell used to be here for a different reason and is worth a note. It reached three byte
# swap builtins first, through a glibc header that defines static inline functions over them
# which the file never calls and which the compiler emitted anyway, and that was
# tamnd/rucc#308. Underneath it was the shell's own `ceil` and `floor`, which is
# tamnd/rucc#226, and the whole of that family is implemented now: the call is a call to the
# library function, which is what gcc emits for it too, and it is answered where the arguments
# are constants. `rucc -c -I . shell.c` exits 0 with no output.
#
# What both files stop on now is further in, and it is the same thing for both: four
# instructions across the two of them use a value that has no definition, which the printer
# writes as `%?` and which the reader then cannot read back. That is tamnd/rucc#1016.
#
# The amalgamation used to be here blaming an atomic builtin and tamnd/rucc#311. That was
# written from what a check said rather than from what a build does, and it was wrong: the
# amalgamation reaches no atomic builtin. A real build on x86-64 Linux stops further down than
# anything here runs, at a `zext` producing an `i128` in `sqlite3Multiply128`, which is
# tamnd/rucc#351 and is a backend refusal rather than a front end one. The record of that
# build is tamnd/rucc#590.

[[exclude]]
cases = ["amalgamation/sqlite3.c", "shell/shell.c"]
issue = "https://github.com/tamnd/rucc/issues/1016"
why = "an instruction uses a value with no definition, so the IR does not read back"
