name = "sqlite"
summary = "The SQLite amalgamation, one translation unit of about eight megabytes and the first real program the compiler is aimed at."
source = "tarball"
upstream = "https://sqlite.org/2026/sqlite-autoconf-3530400.tar.gz"
version = "3.53.4"
sha256 = "0e9483900e92cd5de8fd48d16bf9200145a61f7fd5be542a5ac81d8a9516eb9c"
root = "sqlite-autoconf-3530400"

# SQLite is public domain and ships no separate license file. The blessing is at the top of
# every source file it distributes, so the manifest points at the header, which is the file
# a person reading the tree would look at first.
license = "blessing"
license-file = "sqlite-autoconf-3530400/sqlite3.h"

# One file, a quarter of a million lines, and a configuration macro maze on top. It is the
# throughput case and the correctness case at the same time.
[[unit]]
name = "amalgamation"
kind = "source"
files = ["sqlite3.c"]
flags = ["-DSQLITE_THREADSAFE=0", "-DSQLITE_OMIT_LOAD_EXTENSION"]

# The shell is ordinary application code that includes the library and the system headers,
# which is a different mix from the amalgamation.
[[unit]]
name = "shell"
kind = "source"
files = ["shell.c"]
flags = ["-I", "."]

[[unit]]
name = "headers"
kind = "headers"
dir = "."
flags = ["-I", "."]
skip = [
  # A resource script header for the Windows build, and not a C header at all.
  "sqlite3rc.h",
]

# One case rucc does not get through yet, naming the issue that will take it off this list. An
# entry whose case has started passing fails the run, so the list shrinks as the work lands
# rather than sitting here.
#
# It used to reach three byte swap builtins first, through a glibc header that defines static
# inline functions over them which the file never calls and which this compiler emitted anyway.
# That was tamnd/rucc#308 and closing it was never going to be enough on its own, which is why
# the entry does not name it: the shell writes its own `ceil` and `floor`, and that is what it
# is really waiting on.
#
# The amalgamation used to be on this list too, blaming an atomic builtin and tamnd/rucc#311.
# That was written from what a check said rather than from what a build does, and it was wrong.
# The amalgamation reaches no atomic builtin, and it goes through this harness clean. What it
# does hit is further down than anything here runs: a real build on x86-64 Linux stops at a
# `zext` producing an `i128` in `sqlite3Multiply128`, which is tamnd/rucc#351, and that is a
# backend refusal rather than a front end one. The record of that build is tamnd/rucc#590.

[[exclude]]
case = "shell/shell.c"
issue = "https://github.com/tamnd/rucc/issues/226"
why = "__builtin_ceil and __builtin_floor have no lowering, E0686"
