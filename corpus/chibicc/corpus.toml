name = "chibicc"
summary = "The test suite of chibicc, forty odd programs written one per language feature by somebody building a C compiler, which is the same job from the other side."
source = "tarball"
upstream = "https://codeload.github.com/rui314/chibicc/tar.gz/90d1f7f199cc55b13c7fdb5839d1409806633fdb"
version = "90d1f7f"
sha256 = "cadb44e82354002000f6d2bbf41d3155f47a9b3e9abd50a309fdcd9b5ef791e0"
root = "chibicc-90d1f7f199cc55b13c7fdb5839d1409806633fdb"
license = "MIT"
license-file = "chibicc-90d1f7f199cc55b13c7fdb5839d1409806633fdb/LICENSE"

# A commit rather than a release, because chibicc has never cut one. The hash is over the
# tarball GitHub builds from that commit, which is reproducible as long as the commit is.

# Every file here is a list of assertions and an exit status that says whether they all held, so
# the program decides for itself and nothing outside it has to know what the right answer was.
oracle = "self-check"

# What makes this suite worth the time is who wrote it and why. Every file is one person's
# answer to the question of what a C compiler has to get right about one feature, written while
# building the compiler rather than afterwards, so the cases sit exactly on the parts that are
# easy to get wrong and nowhere else. The overlap with c-testsuite and tcc is small for the same
# reason: those two are collections of programs, and this one is a checklist of language.
[[unit]]
name = "test"
kind = "source"
dir = "test"
# chibicc is from 2020 and its `test.h` declares `int vsprintf();` after a full prototype for
# the same function, which is the unprototyped declaration rule C23 removed. GCC 16 refuses
# every file in the suite under its own default of gnu23, so the dialect is named here rather
# than left to whatever each compiler defaults to.
# The tree itself is on the include path because one of these writes `#include
# "test/pragma-once.c"`, which is a path from the top of it. chibicc's own `include` directory
# is deliberately not, because that holds the freestanding headers chibicc ships in place of
# the machine's, and comparing a compiler against a corpus is more use when the corpus reads
# the headers the compiler will meet in real work.
# `-fpermissive` is here for the same reason the dialect is. GCC 14 turned four rules that had
# been warnings into errors, and chibicc is from 2020, so eleven of these files were on the wrong
# side of a change that came four years after they were written. This is the flag GCC put there
# for exactly that, and both compilers read it, so the eleven are compared rather than skipped.
flags = ["-std=gnu17", "-fpermissive", "-I", "."]
# The `assert` every one of these files calls is defined in `test/common`, along with the
# objects and functions the cases that reach across a translation unit reach for. It goes
# through the compiler under test with the case rather than being built once by the reference,
# because a helper built by the reference would hide every bug in the code that calls it.
link = ["test/common"]
skip = [
  # Twelve entries, and every one of them is a file gcc 16 will not compile whatever it is
  # told. Eleven more were here until the unit asked for `-fpermissive` above, on a comment
  # claiming the reference refused them under every dialect, which measuring says it does not:
  # gcc takes all eleven once it is asked to take them, and eight of those are the one rule
  # about a pointer given a value whose target type is something else. That comment had been
  # here since the corpus went in and nobody had run the experiment it asserted the answer to.
  #
  # A declaration of a standard function that disagrees with the one the machine's headers
  # give. chibicc ships its own headers and these files were written against those, so what
  # they say about `printf` and `vsprintf` is not what `stdio.h` here says.
  "function.c",
  "tls.c",
  # Programs written on chibicc's rules rather than on the language's. A structure with two
  # members of one name, `restrict` on something that is not a pointer, an initializer that
  # is not constant, an assignment to something that is not an lvalue, an `f` suffix on an
  # integer constant, `signed` twice in one specifier list, and a typedef name used again as
  # something else in the same scope.
  "bitfield.c",
  "compat.c",
  "constexpr.c",
  "control.c",
  "generic.c",
  "literal.c",
  "sizeof.c",
  "typedef.c",
  # Includes `include4.h`, which chibicc's makefile writes before it runs the suite and the
  # tarball therefore does not carry.
  "macro.c",
  # A file that includes itself and stops the second read with `#pragma once` in the main
  # file. GCC applies the line there and clang ignores it, so the two compilers that could be
  # the reference give different output for this one file and the result says which of them
  # ran rather than anything about the compiler under test. rucc follows GCC and covers it
  # with an acceptance test of its own instead.
  "pragma-once.c",
]


# The exclusions below came from the eleven files `-fpermissive` opened up. The list had been
# empty, which is worth saying plainly: it was empty because eleven of the twenty nine cases were
# being skipped on an assertion about gcc, and five of those eleven pass now. The rest pointed at
# three gaps this compiler really had, and all three are closed. tamnd/rucc#661 was the obsolete
# array designator `[3] 7`, which `test/initializer.c` wanted, tamnd/rucc#662 was what a `va_end`
# of something that is not a list is called, which `test/varargs.c` wanted, and tamnd/rucc#389 was
# the header the compiler did not ship and the access to an atomic object underneath it, which
# `test/atomic.c` wanted. The compile side of this list is empty again.

[[exec-exclude]]
case = "test/asm.c"
issue = "https://github.com/tamnd/rucc/issues/349"
why = "an asm with instructions in its template needs an assembler, E0653"
outcome = "did not build"

[[exec-exclude]]
case = "test/vla.c"
issue = "https://github.com/tamnd/rucc/issues/291"
why = "nothing here grows the stack for a variable length array, E0653"
outcome = "did not build"

# Before those three there was nothing here, and the way that happened is worth keeping. Every file
# is built with `test/common`, and `test/common` has seven functions that give back a structure by
# value, so one gap in the back end used to block all seventeen cases before any of them got as far
# as its own subject. That made the whole corpus one entry rather than seventeen, and it pointed in
# turn at tamnd/rucc#281 for the address of a name at file scope, then tamnd/rucc#289 for a variadic
# function reading its own arguments, then tamnd/rucc#287 for a structure being copied, and last
# tamnd/rucc#325 for a structure coming back in two registers. That one landed and the whole block
# came out at once, which is what a block written as one gap rather than as seventeen is for.
#
# What was behind it was two files. `test/float.c` wanted the conversions between a sixty four bit
# unsigned integer and a floating point type, which landed in tamnd/rucc#539. `test/arith.c` wanted
# an eighty bit float, which landed in tamnd/rucc#326, and then it wanted GNU's `a ?: b` to
# evaluate its left side once rather than twice, which landed in tamnd/rucc#613.
#
# `test/line.c` is not here either, because it expects the line after `#line 500` to be 501 rather
# than 500 and GCC 16 fails its own build of it on that assertion. `exec` runs the reference
# against the same oracle before it runs us, so a program neither compiler passes is reported as
# skipped and needs no entry that could go stale.
