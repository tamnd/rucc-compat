name = "postgres"
summary = "Every translation unit of a PostgreSQL 18.6 meson build, each with the flags the build compiled it with, taken through rucc's pipeline."

# Postgres is too big to describe in a manifest. Its files are compiled with a dozen different sets
# of include paths and defines, some of them are generated by the build, and src/port and
# src/common are each compiled once per library they go into. The meson build directory already
# records every one of those compiles in compile_commands.json, so the build directory is the
# corpus and the database is the list of cases. See crates/rucc-compat/src/meson.rs.
#
# Nothing is vendored. Configure a build of the release named below with meson, build it far
# enough that every generated file exists, and point the variable at the build directory. Plain
# `ninja` is not far enough. The ecpg test programs are generated from .pgc files only for the
# test suite, so they need `meson-test-prereq` as well:
#
#     meson setup build postgres -Dauto_features=disabled
#     ninja -C build all meson-test-prereq
#     RUCC_COMPAT_POSTGRES=$PWD/build rucc-compat check postgres
#
# The harness refuses a build of any other version, since an exclusion list written against one
# release says nothing about another. With the variable unset the corpus does not apply here and
# is passed over, which is what every machine without the build sees.
source = "build"
variable = "RUCC_COMPAT_POSTGRES"
version = "18.6"

# No oracle. Whether Postgres works is a question for its own regression suite, run against a
# server rucc built, and that lives in tamnd/rucc-postgres. What this corpus asks is narrower and
# cheaper: whether every file of the build gets through rucc's front end, the lowering to IR and
# the IR round trip, with exactly the flags the build uses. That is `check`.

# Every compile in the database. The case names are the file relative to the source directory,
# or the build directory for a generated file, with `@target` on the end of a file that is
# compiled into more than one library.
[[unit]]
name = "meson"
kind = "compile-commands"
skip = [
  # Includes norm_test_table.h, which only the `update-unicode` target generates, and that
  # target downloads the Unicode data files. Neither `ninja` nor `ninja meson-test-prereq`
  # makes the header, so no build this corpus reads has it. GCC can't compile the file either,
  # so this is not a gap.
  "src/common/unicode/norm_test.c",
]
