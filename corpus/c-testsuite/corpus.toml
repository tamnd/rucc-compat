name = "c-testsuite"
summary = "Two hundred and twenty small C programs, each one aimed at a single rule of the language, which is the cheapest way to find a gap in the front end."
source = "tarball"
upstream = "https://codeload.github.com/c-testsuite/c-testsuite/tar.gz/5c7275656d751de0e68b2d340a95b5681858ed07"
version = "5c72756"
sha256 = "010008bf4b5671f947ae7e8d693a1c959a4a4d795fa7227c0abb1f95de45f7e7"
root = "c-testsuite-5c7275656d751de0e68b2d340a95b5681858ed07"
license = "MIT"
license-file = "c-testsuite-5c7275656d751de0e68b2d340a95b5681858ed07/LICENSE"

# A commit rather than a release, because the suite has never cut one. The hash is over the
# tarball GitHub builds from that commit, which is reproducible as long as the commit is.

# Every program here ships a file beside it holding what it is supposed to print, so the answer
# to whether a run was right needs neither a reference compiler nor anything the program says
# about itself. That makes this the corpus `exec` can measure when everything else is broken,
# which is why it is the one the per commit gate runs.
oracle = "recorded"

# These are two hundred small programs and none of them does any work worth speaking of. Ten
# seconds is what a program gets when the manifest says nothing, and it is already three orders
# of magnitude more than any of these needs, so a case that reaches it is looping.
timeout = 10

# Every program in the suite, walked rather than listed, so that moving the pin forward does
# not mean editing two hundred lines by hand.
[[unit]]
name = "single-exec"
kind = "source"
dir = "tests/single-exec"
# The suite predates C23 and several of its programs are written on rules C23 changed, the
# large one being that `int f()` declares a function whose parameters are unspecified. GCC 16
# refuses those programs under its own default of gnu23 exactly as rucc does, so leaving the
# dialect to whatever each compiler defaults to measures the year rather than the compiler.
flags = ["-std=gnu17"]

# No exclusion for `check`. Every program in the suite gets through the front end, the lowering
# to IR and the round trip, which is the first corpus here to reach that and is the rung of the
# target ladder M3 asks for. The last three to come out were the ones that ask for no builtin at
# all and got one anyway, because a glibc header defines three static inline functions over the
# byte swap builtins and this compiler used to emit a static function nothing refers to. An
# entry whose case has started passing fails the run, so a list here shrinks as the work lands
# rather than sitting here.

# `exec` is the harder half and is where the list below comes from. Getting a program through
# the front end and getting the right answer out of the program are different claims, which is
# why the two lists are separate and why this one is long while the one above is empty.

# The lowering rule set is where this corpus stops. Everything below builds and runs on the two
# hundred and twenty programs here, and the two hundred and seven that pass are the ones the rule
# set reaches all the way through. The rest mostly reach an IR opcode no rule names, which is a `did
# not build` rather than a wrong answer, and each block below is one gap and the issue that closes
# it. As a rule lands its block goes stale in one piece and comes out in one commit.

# Structures of `long double` passed through a variadic function and a plain one. The eighty bit
# float is on the x87 stack rather than in a register file, so the rule set names no type for it
# and nothing reads or writes one.
#
# This entry pointed at tamnd/rucc#289 until a variadic function could read its own arguments,
# and then at tamnd/rucc#287 until a structure could be copied. The next thing in the same file
# is what it points at now.
[[exec-exclude]]
issue = "tamnd/rucc#326"
why = "an eighty bit float has no type in the rule set"
outcome = "did not build"
cases = [
  "single-exec/00204.c",
]

# A variable length array, which is a frame that grows during the body rather than a missing
# rule, and is the only one of these blocks whose work is not in the rule set.
[[exec-exclude]]
issue = "tamnd/rucc#291"
why = "nothing here grows the stack for a variable length array"
outcome = "did not build"
cases = [
  "single-exec/00207.c",
]

# The one program in the suite that calls a math function, and the argument is a constant. GCC
# folds `sin(2)` where it stands and never names the library, so it links with no `-lm` and nothing
# here ever needed one. rucc does not fold it and emits the call, which is a call to a name only
# libm defines, and the link step here passes no libraries on any of the three routes. Passing them
# is the missing piece and it is the harness's rather than the compiler's: a program that calls
# `sin` is entitled to `-lm`, and folding it is an optimization this corpus should not be waiting
# on. This case was in the floating point block until that came out, and in the stack argument
# block after that, and it was never really either of them.
[[exec-exclude]]
issue = "tamnd/rucc-compat#39"
why = "the link step passes no libraries, so a call to libm has nowhere to resolve"
outcome = "did not build"
cases = [
  "single-exec/00174.c",
]

# The first entry here that is one level's rather than every level's, and the reason is in the
# header rather than in the program. glibc's `wchar.h` defines `btowc` and `wctob` inline behind
# `__USE_EXTERN_INLINES`, which is on when `__OPTIMIZE__` is defined and `__OPTIMIZE_SIZE__` is
# not, so the only levels that reach the definitions at all are `-O1` through `-O3`. This program
# includes `wchar.h` and it builds everywhere else.
#
# Two gaps meet in those definitions and either one alone would be enough to link. rucc emits the
# inline definition of `btowc` as an external definition when GNU semantics say it is not one,
# which is tamnd/rucc#344, and it drops the asm label that makes the alias inside it refer to the
# symbol libc actually defines, which is tamnd/rucc#345.
[[exec-exclude]]
issue = "tamnd/rucc#344"
why = "an inline definition in a glibc header is emitted, and the alias it calls is unresolved"
outcome = "did not build"
opt = ["1", "2", "3"]
cases = [
  "single-exec/00220.c",
]
