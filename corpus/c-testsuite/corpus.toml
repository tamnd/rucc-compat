name = "c-testsuite"
summary = "Two hundred and twenty small C programs, each one aimed at a single rule of the language, which is the cheapest way to find a gap in the front end."
source = "tarball"
upstream = "https://codeload.github.com/c-testsuite/c-testsuite/tar.gz/5c7275656d751de0e68b2d340a95b5681858ed07"
version = "5c72756"
sha256 = "010008bf4b5671f947ae7e8d693a1c959a4a4d795fa7227c0abb1f95de45f7e7"
root = "c-testsuite-5c7275656d751de0e68b2d340a95b5681858ed07"
license = "MIT"
license-file = "c-testsuite-5c7275656d751de0e68b2d340a95b5681858ed07/LICENSE"

# A commit rather than a release, because the suite has never cut one. The hash is over the
# tarball GitHub builds from that commit, which is reproducible as long as the commit is.

# Every program in the suite, walked rather than listed, so that moving the pin forward does
# not mean editing two hundred lines by hand.
[[unit]]
name = "single-exec"
kind = "source"
dir = "tests/single-exec"

# Thirteen cases rucc does not get through yet, each one naming the issue that will take it off
# this list. An entry whose case has started passing fails the run, so the list shrinks as the
# work lands rather than sitting here. One of them carries a `when`, because the gap it names is
# one platform's ABI and the case passes on the other.

[[exclude]]
case = "single-exec/00048.c"
issue = "https://github.com/tamnd/rucc/issues/144"
why = "a designated initializer out of order is read as one writing over another, E0519"

[[exclude]]
case = "single-exec/00049.c"
issue = "https://github.com/tamnd/rucc/issues/144"
why = "a designated initializer out of order is read as one writing over another, E0519"

[[exclude]]
case = "single-exec/00140.c"
issue = "https://github.com/tamnd/rucc/issues/159"
why = "a structure passed in memory to a variadic function is refused, E0519"
when = ["linux"]

[[exclude]]
case = "single-exec/00147.c"
issue = "https://github.com/tamnd/rucc/issues/144"
why = "a designated initializer out of order is read as one writing over another, E0519"

[[exclude]]
case = "single-exec/00148.c"
issue = "https://github.com/tamnd/rucc/issues/144"
why = "a designated initializer out of order is read as one writing over another, E0519"

[[exclude]]
case = "single-exec/00152.c"
issue = "https://github.com/tamnd/rucc/issues/145"
why = "a directive whose hash is not the first thing on the line is not recognised, E0338"

[[exclude]]
case = "single-exec/00162.c"
issue = "https://github.com/tamnd/rucc/issues/146"
why = "an unprototyped declaration is not reconciled with the prototype next to it, E0586"

[[exclude]]
case = "single-exec/00204.c"
issue = "https://github.com/tamnd/rucc/issues/147"
why = "va_arg of a structure or a union is not lowered, E0519"

[[exclude]]
case = "single-exec/00207.c"
issue = "https://github.com/tamnd/rucc/issues/148"
why = "a goto in a function with a variable length array is not lowered, E0519"

[[exclude]]
case = "single-exec/00209.c"
issue = "https://github.com/tamnd/rucc/issues/146"
why = "a call through an unprototyped declaration is checked against a list that was never given, E0511"

[[exclude]]
case = "single-exec/00210.c"
issue = "https://github.com/tamnd/rucc/issues/149"
why = "a type name for a function returning a function is refused instead of adjusted, E0541"

[[exclude]]
case = "single-exec/00213.c"
issue = "https://github.com/tamnd/rucc/issues/150"
why = "a conditional with one void arm is refused, E0518"

[[exclude]]
case = "single-exec/00216.c"
issue = "https://github.com/tamnd/rucc/issues/151"
why = "a compound literal in a static initializer is called a non constant element, E0618"
