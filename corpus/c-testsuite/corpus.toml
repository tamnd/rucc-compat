name = "c-testsuite"
summary = "Two hundred and twenty small C programs, each one aimed at a single rule of the language, which is the cheapest way to find a gap in the front end."
source = "tarball"
upstream = "https://codeload.github.com/c-testsuite/c-testsuite/tar.gz/5c7275656d751de0e68b2d340a95b5681858ed07"
version = "5c72756"
sha256 = "010008bf4b5671f947ae7e8d693a1c959a4a4d795fa7227c0abb1f95de45f7e7"
root = "c-testsuite-5c7275656d751de0e68b2d340a95b5681858ed07"
license = "MIT"
license-file = "c-testsuite-5c7275656d751de0e68b2d340a95b5681858ed07/LICENSE"

# A commit rather than a release, because the suite has never cut one. The hash is over the
# tarball GitHub builds from that commit, which is reproducible as long as the commit is.

# Every program here ships a file beside it holding what it is supposed to print, so the answer
# to whether a run was right needs neither a reference compiler nor anything the program says
# about itself. That makes this the corpus `exec` can measure when everything else is broken,
# which is why it is the one the per commit gate runs.
oracle = "recorded"

# These are two hundred small programs and none of them does any work worth speaking of. Ten
# seconds is what a program gets when the manifest says nothing, and it is already three orders
# of magnitude more than any of these needs, so a case that reaches it is looping.
timeout = 10

# Every program in the suite, walked rather than listed, so that moving the pin forward does
# not mean editing two hundred lines by hand.
[[unit]]
name = "single-exec"
kind = "source"
dir = "tests/single-exec"
# The suite predates C23 and several of its programs are written on rules C23 changed, the
# large one being that `int f()` declares a function whose parameters are unspecified. GCC 16
# refuses those programs under its own default of gnu23 exactly as rucc does, so leaving the
# dialect to whatever each compiler defaults to measures the year rather than the compiler.
flags = ["-std=gnu17"]

# No exclusions. Every program in the suite passes, which is the first corpus here to reach that
# and is the rung of the target ladder M3 asks for. An entry added later names the issue that
# will take it off again, and an entry whose case has started passing fails the run, so the list
# shrinks as the work lands rather than sitting here.
