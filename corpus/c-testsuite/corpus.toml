# A comparison used as a value, which is an `i1` widened to an `int`. These eight have no global
# and no call in them at all, so this is the only thing between them and running.
[[exec-exclude]]
issue = "tamnd/rucc#285"
why = "`zext` from `i1` has no name in the rule set"
outcome = "did not build"
cases = [
  "single-exec/00035.c",
  "single-exec/00042.c",
  "single-exec/00046.c",
  "single-exec/00105.c",
  "single-exec/00126.c",
  "single-exec/00133.c",
  "single-exec/00134.c",
  "single-exec/00135.c",
]

# Floating point, none of which is lowered, and which waits on the allocator having a second
# register class before any of it can be written.
[[exec-exclude]]
issue = "tamnd/rucc#286"
why = "no floating point opcode has a name in the rule set"
outcome = "did not build"
cases = [
  "single-exec/00113.c",
  "single-exec/00119.c",
  "single-exec/00123.c",
  "single-exec/00174.c",
  "single-exec/00175.c",
  "single-exec/00195.c",
]

# A structure assigned, passed or returned by value, and an initialiser that leaves part of an
# object to be zeroed.
[[exec-exclude]]
issue = "tamnd/rucc#287"
why = "`memcpy` and `memset` have no name in the rule set"
outcome = "did not build"
cases = [
  "single-exec/00140.c",
  "single-exec/00208.c",
  "single-exec/00216.c",
  "single-exec/00220.c",
]

# A call through a function pointer, which is the one failure in the run whose message says what
# it is rather than saying that something has no name.
[[exec-exclude]]
issue = "tamnd/rucc#288"
why = "no rule calls through an address"
outcome = "did not build"
cases = [
  "single-exec/00087.c",
  "single-exec/00089.c",
  "single-exec/00124.c",
  "single-exec/00159.c",
  "single-exec/00189.c",
  "single-exec/00209.c",
  "single-exec/00210.c",
]

# A variadic function reading its own arguments, which needs the register save area the x86-64
# convention puts in the prologue.
[[exec-exclude]]
issue = "tamnd/rucc#289"
why = "`va_start` and the object behind it have no name in the rule set"
outcome = "did not build"
cases = [
  "single-exec/00204.c",
]

# A block control cannot arrive at, which is the smallest of these gaps.
[[exec-exclude]]
issue = "tamnd/rucc#290"
why = "`unreachable` has no name in the rule set"
outcome = "did not build"
cases = [
  "single-exec/00214.c",
  "single-exec/00218.c",
]

# A variable length array, which is a frame that grows during the body rather than a missing
# rule, and is the only one of these blocks whose work is not in the rule set.
[[exec-exclude]]
issue = "tamnd/rucc#291"
why = "nothing here grows the stack for a variable length array"
outcome = "did not build"
cases = [
  "single-exec/00207.c",
]
