# The rows of the conformance corpus, one per construct of the language.
#
# A row names the standard that brought the construct in, the clause that describes it, and the
# case that exercises it or the issue that will make one pass. The clause is C17's, since that is
# one numbering for everything up to it, and C23's for what C23 brought in, which C17 has no
# clause for. `rucc-compat rows conformance` checks every row against the cases and every
# case against the rows. A case may stand behind several rows, since a program about operators
# is a program about all of them.
#
# Not here, and on purpose: #error and every constraint a program must be refused for. Those are
# about what a compiler says rather than what a program does, and they go in the accept and
# reject corpus.

