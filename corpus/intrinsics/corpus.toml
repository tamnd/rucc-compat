name = "intrinsics"
summary = "Small programs that call each x86 intrinsic rucc ships and check the answer against plain C, built by rucc and by the reference."

# The programs are ours and live next to this manifest, so there is nothing to fetch. They are
# under this repository's license.
source = "local"

# Each program works an intrinsic out two ways, once with the intrinsic and once in plain C, over
# edge values and a few thousand random inputs, and prints one line per intrinsic: ok with a
# checksum of what the intrinsic returned, or FAIL with the first inputs it got wrong. The
# reference builds the same programs, so the checksums have to match as well, which catches the
# case where rucc's intrinsic and the plain C beside it are wrong in the same way.
#
# The weight is on what Postgres uses: the SSE2 operations behind src/include/port/simd.h, the
# SSE4.2 CRC32C steps, popcount, and the cpuid and xgetbv checks that pick between them at run
# time. The rest of SSE2 is here because rucc ships it in the same headers. Anything past SSE2 is
# guarded by cpuid, so a machine without it prints that it has nothing to check and passes. The
# machine has to be x86-64, since the headers are.
oracle = "differential"
timeout = 20
arch = ["x86_64"]

# The SSE2 integer and floating point intrinsics, and simd.h's functions copied out of Postgres
# with pg_lfind8, pg_lfind8_le and pg_lfind32 built on them.
[[unit]]
name = "sse2"
kind = "source"
dir = "sse2"
libs = ["-lm"]

# __get_cpuid and its relatives against the instruction run directly, and _xgetbv against xgetbv.
[[unit]]
name = "cpu"
kind = "source"
dir = "cpu"

# The CRC32C and popcount intrinsics from functions carrying a target attribute, in a unit built
# for the baseline. This is how Postgres builds them when it chooses at run time.
[[unit]]
name = "attribute"
kind = "source"
dir = "attribute"

# The same intrinsics in a unit built with -msse4.2 and -mpopcnt and no attribute, which is the
# other way Postgres's configure can pick.
[[unit]]
name = "flagged"
kind = "source"
dir = "flagged"
flags = ["-msse4.2", "-mpopcnt"]
