name = "intrinsics"
summary = "Small programs that call each x86 and Arm intrinsic rucc ships and compare the answers, built by rucc and by the reference."

# The programs are ours and live next to this manifest, so there is nothing to fetch. They are
# under this repository's license.
source = "local"

# Each x86 program works an intrinsic out two ways, once with the intrinsic and once in plain C,
# over edge values and a few thousand random inputs, and prints one line per intrinsic: ok with a
# checksum of what the intrinsic returned, or FAIL with the first inputs it got wrong. The
# reference builds the same programs, so the checksums have to match as well, which catches the
# case where rucc's intrinsic and the plain C beside it are wrong in the same way.
#
# The weight is on what Postgres uses: the SSE2 operations behind src/include/port/simd.h, the
# SSE4.2 CRC32C steps, popcount, and the cpuid and xgetbv checks that pick between them at run
# time. The rest of SSE2 is here because rucc ships it in the same headers. Anything past SSE2 is
# guarded by cpuid, so a machine without it prints that it has nothing to check and passes.
#
# The Arm side is the same idea at a different size. rucc's arm_neon.h has a couple of thousand
# intrinsics, so the neon unit is written by scripts/arm_neon.py from arm_neon.txt, a table of
# every one of them, and each program prints a checksum per intrinsic with no plain C beside it:
# gcc's arm_neon.h is the instructions themselves, and its answer is the one a user expects. What
# Postgres uses is checked against plain C as well, in neon-simd for simd.h and pg_lfind.h and in
# the two acle units for the eight CRC32 steps of arm_acle.h and pg_crc32c_armv8.c's loop.
#
# Every unit names the one architecture its headers are for. Neither compiler has emmintrin.h on
# arm64 or arm_neon.h on x86-64, so a unit for the other machine is passed over rather than run as
# a list of build failures that say nothing about rucc.
oracle = "differential"
timeout = 20

# The SSE2 integer and floating point intrinsics, and simd.h's functions copied out of Postgres
# with pg_lfind8, pg_lfind8_le and pg_lfind32 built on them.
[[unit]]
name = "sse2"
kind = "source"
dir = "sse2"
arch = ["x86_64"]
libs = ["-lm"]

# __get_cpuid and its relatives against the instruction run directly, and _xgetbv against xgetbv.
[[unit]]
name = "cpu"
kind = "source"
dir = "cpu"
arch = ["x86_64"]

# The CRC32C and popcount intrinsics from functions carrying a target attribute, in a unit built
# for the baseline. This is how Postgres builds them when it chooses at run time.
[[unit]]
name = "attribute"
kind = "source"
dir = "attribute"
arch = ["x86_64"]

# The same intrinsics in a unit built with -msse4.2 and -mpopcnt and no attribute, which is the
# other way Postgres's configure can pick.
[[unit]]
name = "flagged"
kind = "source"
dir = "flagged"
arch = ["x86_64"]
flags = ["-msse4.2", "-mpopcnt"]

# Every intrinsic rucc's arm_neon.h ships, a program a family, written by scripts/arm_neon.py
# from arm_neon.txt. Do not edit these by hand.
[[unit]]
name = "neon"
kind = "source"
dir = "neon"
arch = ["aarch64"]

# simd.h's NEON functions copied out of Postgres, with pg_lfind8, pg_lfind8_le and pg_lfind32 built
# on them.
[[unit]]
name = "neon-simd"
kind = "source"
dir = "neon-simd"
arch = ["aarch64"]

# The eight CRC32 intrinsics of arm_acle.h from functions carrying target("+crc"), in a unit built
# for plain armv8-a, which is how Postgres builds them when it chooses at run time.
[[unit]]
name = "acle-attribute"
kind = "source"
dir = "acle-attribute"
arch = ["aarch64"]

# The same in a unit built with -march=armv8-a+crc+simd and no attribute, which is the other way
# Postgres's configure can pick.
[[unit]]
name = "acle-flagged"
kind = "source"
dir = "acle-flagged"
flags = ["-march=armv8-a+crc+simd"]
arch = ["aarch64"]
