# The per-commit gate for the harness, and the sweep it exists to run.
#
# Two halves. The first is the harness itself, which is ordinary Rust and has to build and
# pass everywhere. The second is the differential, which builds rucc from its main branch and
# preprocesses a real header set with it. That half was advisory because rucc could not get
# through a system header, and it is not advisory any more: the standard and posix units of
# both libcs are clean against gcc 16, so a red run there means something changed.
#
# Actions are pinned to a patch version rather than a major tag, the same as in the compiler
# repository. A major tag is a moving reference, and a run nobody can reproduce is a run
# nobody can bisect.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  # The sweep is worth running on its own schedule, because it fails when rucc changes rather
  # than when this repository does.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  quick:
    name: format and lints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
      - name: cargo doc
        run: cargo doc --workspace --no-deps

  test:
    name: test on ${{ matrix.name }}
    needs: quick
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86-64
            os: ubuntu-24.04
          - name: macos arm64
            os: macos-26
          - name: windows x86-64
            os: windows-2025
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: cargo test
        run: cargo test --workspace
      # The manifests are data and data that does not load is data nobody finds out about
      # until the day they need it.
      - name: the corpora load
        run: cargo run --quiet -- list

  # The sweep. Advisory until rucc gets through a system header, which is the M1 exit
  # criterion this job exists to measure.
  # No longer advisory. It went red on its own reasons rather than on rucc's for a long time,
  # and the last of those closed with tamnd/rucc#160 and #161 moving the reference to gcc 16
  # and fixing the three preprocessor differences that found. The one difference left is
  # registered in divergences.toml against tamnd/rucc#163 rather than silenced here.
  #
  # It stays outside the required check below for the same reason the pipeline job does: it
  # builds rucc from its main branch, and a regression there should not block a pull request
  # in this repository. Red and visible is what it is for.
  differential:
    name: differential against ${{ matrix.libc }}
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - libc: glibc
            container: ""
          - libc: musl
            container: alpine:3.22
    container: ${{ matrix.container }}
    steps:
      - name: alpine needs a toolchain and a compiler to compare against
        if: matrix.libc == 'musl'
        run: apk add --no-cache cargo git build-base
      - uses: actions/checkout@v7.0.1
      - name: check out the compiler
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - name: build the compiler
        run: cargo build --release --bin rucc --manifest-path rucc/Cargo.toml
      - name: build the harness
        run: cargo build --release
      # The reference is GCC 16, which is the current release. A compiler measured against a
      # compiler four years old is measured against the wrong thing: gcc 16 defines
      # __CHAR8_TYPE__ in C23 where gcc 13 defines it in no dialect, and its own stdatomic.h
      # declares a type behind that macro. Ubuntu 24.04 ships 13, so this comes from the
      # toolchain PPA. Alpine has no equivalent and keeps its own, which is fine there: the
      # musl job is about musl's headers rather than about the reference's version.
      - name: the reference compiler
        if: matrix.libc == 'glibc'
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y gcc-16
          gcc-16 --version | head -1
      # The standard headers first, because they are the ones every program includes and the
      # ones a report is worth reading about. The sweep over everything installed comes later,
      # when the standard set is clean.
      - name: run the standard headers
        env:
          CC: ${{ matrix.libc == 'glibc' && 'gcc-16' || 'cc' }}
        run: |
          ./target/release/rucc-compat run ${{ matrix.libc }} \
            --unit standard --rucc rucc/target/release/rucc --report
      - name: run the posix headers
        if: always()
        env:
          CC: ${{ matrix.libc == 'glibc' && 'gcc-16' || 'cc' }}
        run: |
          ./target/release/rucc-compat run ${{ matrix.libc }} \
            --unit posix --rucc rucc/target/release/rucc
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: differential-${{ matrix.libc }}
          path: results/
          if-no-files-found: ignore

  # The pipeline check, which needs no reference compiler because it is not comparing against
  # one. Every case that does not get through is named in a manifest with the issue it waits
  # on, so a red run here means something changed rather than something was always broken.
  #
  # This was advisory, for one reason: rucc claimed to be GCC 4.2.1, so glibc took the branch
  # of bits/floatn-common.h that typedefs _Float32 and the rest over rucc's own keywords, and
  # sixty of the c-testsuite cases failed on that one line no matter what else was true of
  # them. tamnd/rucc#142 raised the claim to 7 and the manifests now say the same thing on
  # Linux that they say on a Mac, so the job is red only when something changed.
  #
  # It stays outside the required check below, because it builds rucc from its main branch and
  # a regression there should not block a pull request in this repository. Red and visible is
  # what it is for.
  pipeline:
    name: pipeline over ${{ matrix.corpus }}
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        corpus: [c-testsuite, chibicc, gcc-torture, tcc]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check out the compiler
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build the compiler
        run: cargo build --release --bin rucc --manifest-path rucc/Cargo.toml
      - name: build the harness
        run: cargo build --release
      # Keyed on the digest the manifest names rather than on the manifest, because the
      # manifest changes every time an exclusion is added and the tarball it points at does
      # not. The gcc-torture one is the whole of GCC and a hundred megabytes of it, so a key
      # that turned over on every pull request would be a download on every pull request. Only
      # the archive is kept: unpacking it again is seconds and caching a tree of eight thousand
      # small files is not.
      - name: name the cache after the tarball
        id: tarball
        run: |
          sha=$(sed -n 's/^sha256 = "\(.*\)"$/\1/p' corpus/${{ matrix.corpus }}/corpus.toml)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: reuse the download if we have it
        uses: actions/cache@v6.1.0
        with:
          path: vendor/${{ matrix.corpus }}/*.tar.*
          key: corpus-${{ matrix.corpus }}-${{ steps.tarball.outputs.sha }}
      - name: fetch the corpus
        run: ./target/release/rucc-compat fetch ${{ matrix.corpus }}
      - name: take it through the pipeline
        run: |
          ./target/release/rucc-compat check ${{ matrix.corpus }} \
            --rucc rucc/target/release/rucc --report
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: pipeline-${{ matrix.corpus }}
          path: results/
          if-no-files-found: ignore

  # The programs built and run, which is the only job here that says anything about the back
  # half of the compiler. Every job above can be green while the executable prints the wrong
  # answer, because every job above is a question about compiling.
  #
  # Two corpora rather than three. tcc names no oracle, so there is nothing to decide a run by
  # and `exec` passes it over. gcc-torture has an oracle and a list now, and it runs nightly in
  # the job below rather than here, because it is nineteen hundred programs and this job runs on
  # every commit.
  #
  # x86-64 Linux only, because that is the one target rucc generates code for today. The second
  # target and the second host are M6, and the matrix here grows when they arrive.
  #
  # Every level, because a level is not a setting on one answer. `-O0` and `-O2` run different
  # passes over different code and the headers themselves change underneath them: glibc defines a
  # family of functions inline behind `__OPTIMIZE__ && !__OPTIMIZE_SIZE__`, so a program compiled
  # at `-O2` includes code that is simply not there at `-O0` or at `-Os`. A sweep at one level
  # says nothing about the other five, and an optimizer whose output is only ever run at `-O0` is
  # an optimizer nobody has tested. This is what tamnd/rucc#260 asks for.
  #
  # Twelve jobs rather than one that loops, so the whole sweep costs one job's wall clock and a
  # level that goes red says which one it was in its own name.
  exec:
    name: exec over ${{ matrix.corpus }} at -O${{ matrix.opt }}
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        corpus: [c-testsuite, chibicc]
        opt: ["0", "1", "2", "3", "s", "z"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check out the compiler
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build the compiler
        run: cargo build --release --bin rucc --manifest-path rucc/Cargo.toml
      - name: build the harness
        run: cargo build --release
      # The same reference as the differential, and for the same reason. It is more than the
      # arbiter here: the assembly and object paths hand their output to it to assemble and
      # link, so a case cannot run at all without it.
      - name: the reference compiler
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y gcc-16
          gcc-16 --version | head -1
      - name: name the cache after the tarball
        id: tarball
        run: |
          sha=$(sed -n 's/^sha256 = "\(.*\)"$/\1/p' corpus/${{ matrix.corpus }}/corpus.toml)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: reuse the download if we have it
        uses: actions/cache@v6.1.0
        with:
          path: vendor/${{ matrix.corpus }}/*.tar.*
          key: corpus-${{ matrix.corpus }}-${{ steps.tarball.outputs.sha }}
      - name: fetch the corpus
        run: ./target/release/rucc-compat fetch ${{ matrix.corpus }}
      # The machine is named rather than left to the report to work out, because what the report
      # would otherwise print is the operating system and the architecture and nothing about
      # which of the two runners this was.
      # `--rule-coverage` asks the compiler which of its lowering rules each build fired and
      # writes the union over this corpus at this level. One file per job rather than one for
      # the sweep, because the jobs are twelve machines that never meet, and the file goes up
      # with the report so that a union across all of them can be taken from the artifacts.
      - name: build them and run them
        run: |
          ./target/release/rucc-compat exec ${{ matrix.corpus }} \
            --rucc rucc/target/release/rucc --cc gcc-16 --opt ${{ matrix.opt }} \
            --machine github-ubuntu-24.04 --report \
            --rule-coverage results/${{ matrix.corpus }}-O${{ matrix.opt }}.cov
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: exec-${{ matrix.corpus }}-O${{ matrix.opt }}
          path: results/
          if-no-files-found: ignore

  # The torture suite, built and run. This is the same thing the job above does and it is a
  # separate job for one reason: it is nineteen hundred programs against eighty, so it costs
  # about a quarter of an hour a level where the job above costs a minute and a half. Paying
  # that on every commit would make every pull request in this repository wait on it, and the
  # suite fails when rucc changes rather than when this repository does.
  #
  # So it runs on the nightly schedule and on demand, and the `if` here is what keeps it off
  # pull requests. This is the last of what tamnd/rucc#260 asks for.
  #
  # Six jobs, one a level, for the same reason the job above is twelve: the whole sweep costs
  # one job's wall clock and a level that goes red says which one it was in its own name.
  torture:
    name: torture at -O${{ matrix.opt }}
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quick
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        opt: ["0", "1", "2", "3", "s", "z"]
    steps:
      - uses: actions/checkout@v7.0.1
      - name: check out the compiler
        uses: actions/checkout@v7.0.1
        with:
          repository: tamnd/rucc
          path: rucc
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build the compiler
        run: cargo build --release --bin rucc --manifest-path rucc/Cargo.toml
      - name: build the harness
        run: cargo build --release
      # The reference is the arbiter and it is also more than that here. Five hundred of these
      # programs are ones gcc itself refuses under the dialect this unit names, and `exec`
      # decides those by asking the reference rather than by a list, so a run without it would
      # be a run that called five hundred of rucc's refusals failures.
      - name: the reference compiler
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get install -y gcc-16
          gcc-16 --version | head -1
      - name: name the cache after the tarball
        id: tarball
        run: |
          sha=$(sed -n 's/^sha256 = "\(.*\)"$/\1/p' corpus/gcc-torture/corpus.toml)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: reuse the download if we have it
        uses: actions/cache@v6.1.0
        with:
          path: vendor/gcc-torture/*.tar.*
          key: corpus-gcc-torture-${{ steps.tarball.outputs.sha }}
      - name: fetch the corpus
        run: ./target/release/rucc-compat fetch gcc-torture
      - name: build them and run them
        run: |
          ./target/release/rucc-compat exec gcc-torture \
            --rucc rucc/target/release/rucc --cc gcc-16 --opt ${{ matrix.opt }} \
            --machine github-ubuntu-24.04 --report \
            --rule-coverage results/gcc-torture-O${{ matrix.opt }}.cov
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: torture-O${{ matrix.opt }}
          path: results/
          if-no-files-found: ignore

  # What the sweep reached of the compiler's lowering rule set, and the floor under that number.
  #
  # This is the second of the three stages tamnd/rucc#261 asks for. The first was reporting the
  # number so that its movement is visible, this is a threshold so it cannot fall, and a hundred
  # percent with a checked in list of what the corpus cannot reach comes after that.
  #
  # It is one job rather than a step in each of the eighteen above because the number is about
  # the sweep and not about one corpus at one level. Those jobs are eighteen machines that never
  # meet, so each writes its own file and this one unions them, which is the only place the whole
  # answer exists.
  #
  # On the schedule and on demand rather than on every commit, because the torture suite is
  # eighteen of the nineteen hundred programs behind the number and it runs on the schedule. A
  # floor over the two small corpora alone would be a different and much lower number, and two
  # floors that mean different things is worse than one that is checked once a day.
  #
  # The floor is written here rather than in a file of its own so that raising it is a change to
  # the workflow that measured it, reviewed in the same place as the corpus changes that earn it.
  # When the number leaves it behind the job says so and passes, since a floor that is behind
  # hides nothing.
  floor:
    name: lowering rule coverage floor
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: [exec, torture]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - name: build the harness
        run: cargo build --release
      # Every artifact of the sweep, which is more than the coverage files. The rest of what is
      # in them is markdown, and `coverage` reads a directory by looking for the extension the
      # compiler writes rather than by taking everything it finds.
      - name: collect what the sweep recorded
        uses: actions/download-artifact@v4.3.0
        with:
          path: sweep
      - name: union it and check the floor
        run: ./target/release/rucc-compat coverage sweep --report --floor 71.1
      - name: keep the report
        if: always()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: rule-coverage
          path: results/
          if-no-files-found: ignore

  # A single required check, so branch protection does not have to list every job above. The
  # differential, the pipeline, the execution and the torture suite are deliberately not in this
  # list: all four build rucc from its main branch, and a pull request here is about this
  # repository.
  ci:
    name: ci
    if: always()
    needs: [quick, test]
    runs-on: ubuntu-24.04
    steps:
      - name: fail if anything upstream failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: pass
        run: echo "all required jobs succeeded"
